# dlis-web — Laravel 12 + Inertia/React (nginx + php-fpm combined in one container)
# Database: Supabase (external Postgres) — no local DB container needed.
#
# ── First-time deploy ────────────────────────────────────────────────────
#   cp .env.example .env
#   # Edit .env: APP_KEY, APP_URL, DB_* (Supabase connection details)
#   docker compose up -d --build
#   docker compose exec app php artisan key:generate
#
name: dlis_web

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: render
    image: dlis-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV:   ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      # Render injects PORT at runtime; locally we pick a fixed value so
      # nginx inside the container has something to substitute into its
      # config template, matching how the entrypoint script behaves on
      # Render (defaults to 10000 if PORT isn't set at all).
      PORT: ${PORT:-10000}
    ports:
      - "${HTTP_PORT:-8080}:${PORT:-10000}"
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache

volumes:
  app_storage:
  app_bootstrap_cache: